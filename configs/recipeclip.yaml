# configs/recipeclip.yaml
# ============================================================
# RecipeCLIP-10K — master config for E2/E3 training
# ============================================================
# Edit this file to switch between ablation experiments.
# Pass --config configs/recipeclip.yaml to train_recipeclip.py
# ============================================================

# ----------------------------------------------------------
# Experiment tag (used as checkpoint sub-directory prefix)
# ----------------------------------------------------------
experiment: "E2_frozen_backbone"

# ----------------------------------------------------------
# Model
# ----------------------------------------------------------
model:
  clip_model_name : "ViT-B-32"          # open_clip model name
  pretrained      : "laion2b_s34b_b79k" # open_clip pretrained weights tag
  embed_dim       : 256                  # projection output dim (shared)
  proj_hidden_dim : 512                  # hidden dim inside projection heads
  dropout         : 0.1                  # dropout in projection heads
  text_dim        : 384                  # MiniLM output dim (intrs field)
  freeze_backbone : true                 # E2: true  |  E3: false

# ----------------------------------------------------------
# Loss
# ----------------------------------------------------------
loss:
  temperature     : 0.07   # initial τ (same as CLIP)
  learnable_temp  : true   # jointly optimise log(1/τ)

# ----------------------------------------------------------
# Data
# ----------------------------------------------------------
data:
  img_path  : "data/images/"
  data_path : "data/"
  workers   : 4            # DataLoader worker processes per GPU

# ----------------------------------------------------------
# Training
# ----------------------------------------------------------
training:
  seed         : 42
  epochs       : 30
  batch_size   : 128       # per GPU; effective 256 with 2 × T4
  val_freq     : 2         # validate every N epochs
  patience     : 5         # early-stop patience (epochs without MedR improvement)

  # Optimiser  (AdamW)
  lr_head      : 3.0e-4   # learning rate for projection heads
  lr_backbone  : 0.0      # 0 = backbone frozen (E2); set 1e-5 for E3
  weight_decay : 0.01
  grad_clip    : 1.0      # max grad norm (applied after backward)

  # Warmup (cosine-decay scheduler with linear warmup)
  warmup_epochs : 2

  # Checkpoint directory
  snapshots    : "snapshots/recipeclip/"

# ----------------------------------------------------------
# Evaluation
# ----------------------------------------------------------
eval:
  medr_N   : 1000    # number of samples for median-rank trials
  n_trials : 10      # number of random draws (same protocol as baseline)
  batch_size: 256    # inference batch size
